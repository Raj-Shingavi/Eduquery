{% extends 'base.html' %}

{% block content %}
<div class="glass-panel" style="max-width: 400px; margin: 0 auto;">
    <h2 style="color: var(--accent-color); text-align: center; margin-top: 0;">Login</h2>
    
    <form method="post">
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="alert" style="background: rgba(255, 75, 75, 0.2); border-color: #ff4b4b; color: white;">
                Your username and password didn't match. Please try again.
            </div>
        {% endif %}
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" class="form-control" autofocus required id="id_username">
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" class="form-control" required id="id_password">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Login</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-secondary);">
        Don't have an account? <a href="{% url 'register' %}" style="color: var(--accent-color);">Sign Up</a>
    </p>
</div>
{% endblock %}
