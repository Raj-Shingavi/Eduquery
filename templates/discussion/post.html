{% extends 'base.html' %}

{% block content %}
<div class="glass-panel" style="max-width: 600px; margin: 0 auto;">
    <h2 style="color: var(--accent-color); margin-top: 0;">Post a New Doubt</h2>
    <p style="color: var(--text-secondary); margin-bottom: 25px;">Ask your question so peers can discuss and help.</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_title">Question Title</label>
            {{ form.title }}
        </div>
        <div class="form-group">
            <label for="id_content">Details</label>
            {{ form.content }}
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Question</button>
    </form>
</div>
{% endblock %}
